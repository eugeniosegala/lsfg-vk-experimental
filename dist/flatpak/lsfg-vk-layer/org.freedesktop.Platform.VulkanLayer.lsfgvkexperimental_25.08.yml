id: org.freedesktop.Platform.VulkanLayer.lsfgvkexperimental
default-branch: develop

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
branch: '25.08'
build-extension: true

sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
  - org.freedesktop.Sdk.Compat.i386
  - org.freedesktop.Sdk.Extension.toolchain-i386

build-options:
  prefix: /usr/lib/extensions/vulkan/lsfgvkexperimental
  append-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib

modules:
  - name: lsfg-vk
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -DCMAKE_CXX_COMPILER=clang++
      - -DCMAKE_INSTALL_LIBDIR=lib64
      - -DBUILD_TESTING=OFF
      - -DLSFGVK_BUILD_VK_LAYER=ON
      - -DLSFGVK_BUILD_UI=OFF
      - -DLSFGVK_BUILD_CLI=OFF
      - -DLSFGVK_LAYER_LIBRARY_PATH=/usr/lib/extensions/vulkan/lsfgvkexperimental/lib64/liblsfg-vk-layer.so
    sources:
      - type: dir
        path: ../../..

  - name: lsfg-vk-32bit
    buildsystem: cmake-ninja
    build-options:
      append-path: /usr/lib/sdk/toolchain-i386/bin
      env:
        CC: i686-unknown-linux-gnu-gcc
        CXX: i686-unknown-linux-gnu-g++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_COMPILER=i686-unknown-linux-gnu-g++
      - -DCMAKE_INSTALL_LIBDIR=lib/i386-linux-gnu
      - -DBUILD_TESTING=OFF
      - -DLSFGVK_BUILD_VK_LAYER=ON
      - -DLSFGVK_BUILD_UI=OFF
      - -DLSFGVK_BUILD_CLI=OFF
      - -DLSFGVK_LAYER_MANIFEST_SUFFIX=.x86
      - -DLSFGVK_LAYER_LIBRARY_PATH=/usr/lib/extensions/vulkan/lsfgvkexperimental/lib/i386-linux-gnu/liblsfg-vk-layer.so
    sources:
      - type: dir
        path: ../../..
